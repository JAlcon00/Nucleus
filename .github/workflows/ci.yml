# SCRUM-189 — CI en GitHub.
#
# Corre `make ci` (guard + swift build/test de PRCore + build iOS + build watchOS) en cada
# pull request y en cada push a `main`. Es el MISMO comando que se usa en local: lo que pasa
# aquí es lo que pasa en la máquina del desarrollador.
#
# La versión de Xcode se elige de una lista EXPLÍCITA en orden de preferencia
# (XCODE_CANDIDATES). Se usa la primera instalada en el runner y queda impresa en el log. Si
# no hay ninguna, el job FALLA con la lista de versiones disponibles: no se desactiva ningún
# gate para ponerlo en verde. Piso: Xcode 26.5 (SDK de iOS 26.5 = deployment target del
# proyecto). El código no usa APIs de iOS 27 (van detrás de #available), así que 26.5 compila;
# 27.x es lo preferido porque es la versión vigente del equipo.
#
# Las pruebas de UI (`make test-ui`) quedan fuera: necesitan un simulador con sesión gráfica y
# hoy sólo corren de forma fiable desde Xcode.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo a la misma rama cancela la corrida anterior (ahorra minutos de macOS).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Orden de preferencia. Corrida del 2026-10-21: `macos-26` NO trae Xcode 27.1.
  XCODE_CANDIDATES: "27.1 27.0 26.5"

jobs:
  ci:
    name: make ci
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seleccionar Xcode (${{ env.XCODE_CANDIDATES }})
        run: |
          set -euo pipefail
          selected=""
          for version in ${XCODE_CANDIDATES}; do
            candidate="/Applications/Xcode_${version}.app"
            if [[ -d "$candidate" ]]; then
              selected="$candidate"
              echo "Xcode elegido: ${version}"
              break
            fi
          done
          if [[ -z "$selected" ]]; then
            echo "::error::Ninguna de las versiones de Xcode (${XCODE_CANDIDATES}) está instalada en este runner."
            echo "Versiones disponibles:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$selected/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Simuladores disponibles
        run: xcrun simctl list runtimes

      - name: make ci
        run: make ci

      # Los logs de cada gate viven en `.ci/` (están en .gitignore, no en el repo). Se vuelcan
      # aquí para leer la falla sin descargar el artifact: primero las líneas de error/fallo y
      # después el final de cada log.
      - name: Mostrar logs de .ci/ si falló
        if: failure()
        run: |
          shopt -s nullglob
          for logfile in .ci/*.log; do
            echo "::group::${logfile}: líneas de error"
            grep -nE "error:|✘|failed|Fatal error" "$logfile" | head -n 300 || true
            echo "::endgroup::"
            echo "::group::${logfile}: últimas 150 líneas"
            tail -n 150 "$logfile"
            echo "::endgroup::"
          done

      # `.ci/` es una carpeta oculta: upload-artifact@v4 las ignora salvo `include-hidden-files`.
      - name: Subir logs de .ci/ si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: .ci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
